<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="On-premise AI stack">
  <defs>
    <radialGradient id="htAtmos" cx="70%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1e2555" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#121a35" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="htTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="htSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3730a3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="htBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="htGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="rgba(129,140,248,0.07)" stroke-width="1"/>
    </pattern>
    <filter id="htSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="#0b0f1a"/>
  <rect width="1200" height="600" fill="url(#htGrid)"/>
  <circle cx="820" cy="300" r="420" fill="url(#htAtmos)"/>

  <!-- Corner labels -->
  <g font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="3" fill="rgba(165,180,252,0.75)">
    <text x="40" y="34">[SYS] ON-PREMISE · SOVEREIGN AI STACK</text>
    <text x="1160" y="34" text-anchor="end">NX-STACK · v2.6</text>
    <text x="40" y="580">L1 · L2 · L3 · L4 · L5</text>
    <text x="1160" y="580" text-anchor="end">AIR-GAP · 152-ФЗ</text>
  </g>

  <!-- Big central diamond (isometric) — the "API · Integrations" layer featured -->
  <g transform="translate(780 300)">
    <!-- glow -->
    <ellipse rx="340" ry="90" fill="rgba(129,140,248,0.2)" filter="url(#htSoft)"/>
    <!-- top face -->
    <polygon points="0,-130 260,0 0,130 -260,0" fill="url(#htTop)" stroke="rgba(199,210,254,0.95)" stroke-width="1.6"/>
    <polygon points="0,-130 260,0 0,130 -260,0" fill="none" stroke="rgba(199,210,254,0.5)" stroke-width="1.2">
      <animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.6s" repeatCount="indefinite"/>
    </polygon>
    <!-- side faces (isometric depth) -->
    <polygon points="-260,0 0,130 0,180 -260,50" fill="url(#htSide)" stroke="rgba(129,140,248,0.35)" stroke-width="1"/>
    <polygon points="260,0 0,130 0,180 260,50" fill="url(#htSide)" stroke="rgba(129,140,248,0.35)" stroke-width="1"/>

    <!-- Chips on top face -->
    <g font-family="'JetBrains Mono',monospace" font-size="10.5" letter-spacing="1.6" fill="rgba(229,231,235,0.98)">
      <g transform="translate(-112 -32)">
        <rect width="78" height="26" rx="5" fill="rgba(16,21,42,0.8)" stroke="rgba(165,180,252,0.55)"/>
        <text x="39" y="17" text-anchor="middle">FastAPI</text>
      </g>
      <g transform="translate(-26 -18)">
        <rect width="58" height="26" rx="5" fill="rgba(129,140,248,0.3)" stroke="rgba(199,210,254,0.85)"/>
        <text x="29" y="17" text-anchor="middle">gRPC</text>
      </g>
      <g transform="translate(46 -32)">
        <rect width="78" height="26" rx="5" fill="rgba(16,21,42,0.8)" stroke="rgba(165,180,252,0.55)"/>
        <text x="39" y="17" text-anchor="middle">WEBHOOK</text>
      </g>
    </g>

    <!-- Label -->
    <text x="0" y="56" text-anchor="middle" font-family="'Inter',system-ui,sans-serif" font-size="22" font-weight="800" fill="rgba(229,231,235,1)">API · Integrations</text>
    <text x="0" y="76" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="3" fill="rgba(165,180,252,0.75)">FASTAPI · GRPC · LDAP · S3 · L5</text>
    <!-- status dot -->
    <g transform="translate(240 -6)">
      <circle r="5" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- Down-beam hinting continuation to the rest of the stack below the fold -->
  <g>
    <line x1="780" y1="484" x2="780" y2="568" stroke="url(#htBeam)" stroke-width="2"/>
    <circle cx="780" cy="490" r="3.5" fill="#a5b4fc">
      <animate attributeName="cy" values="490;560;490" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="510" r="2.8" fill="#818cf8">
      <animate attributeName="cy" values="510;562;510" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <text x="780" y="560" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="3" fill="rgba(165,180,252,0.7)">↓ L4 — L1</text>

  <!-- Compact status column right -->
  <g transform="translate(1028 150)" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="rgba(229,231,235,0.95)">
    <g transform="translate(0 0)">
      <circle cx="6" cy="8" r="5.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="22" y="13">API · HEALTHY</text>
    </g>
    <g transform="translate(0 42)">
      <circle cx="6" cy="8" r="5.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.4;1" dur="1.7s" repeatCount="indefinite"/></circle>
      <text x="22" y="13">12 AGENTS · UP</text>
    </g>
    <g transform="translate(0 84)">
      <circle cx="6" cy="8" r="5.5" fill="#818cf8"><animate attributeName="opacity" values="1;0.5;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="22" y="13">GPU · 72% UTIL</text>
    </g>
    <g transform="translate(0 126)">
      <circle cx="6" cy="8" r="5.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/></circle>
      <text x="22" y="13">AIRGAP · ON</text>
    </g>
  </g>

  <!-- Bottom separator line -->
  <line x1="40" y1="540" x2="1160" y2="540" stroke="rgba(129,140,248,0.25)" stroke-dasharray="2 6"/>
</svg>
