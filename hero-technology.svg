<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="tg1" cx="60%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a2048" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="tf1"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1200" height="600" fill="#0b0f1a"/>
  <rect width="1200" height="600" fill="url(#tg1)"/>
  <ellipse cx="780" cy="300" rx="400" ry="300" fill="url(#tg2)" filter="url(#tf1)"/>

  <!-- Isometric grid -->
  <g opacity="0.06" stroke="#818cf8" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="400" y1="100" x2="1100" y2="100"/>
    <line x1="370" y1="175" x2="1100" y2="175"/>
    <line x1="340" y1="250" x2="1100" y2="250"/>
    <line x1="310" y1="325" x2="1100" y2="325"/>
    <line x1="280" y1="400" x2="1100" y2="400"/>
    <line x1="250" y1="475" x2="1100" y2="475"/>
    <!-- Diagonal left -->
    <line x1="450" y1="100" x2="250" y2="475"/>
    <line x1="565" y1="100" x2="365" y2="475"/>
    <line x1="680" y1="100" x2="480" y2="475"/>
    <line x1="795" y1="100" x2="595" y2="475"/>
    <line x1="910" y1="100" x2="710" y2="475"/>
    <line x1="1025" y1="100" x2="825" y2="475"/>
    <!-- Diagonal right -->
    <line x1="450" y1="100" x2="650" y2="475"/>
    <line x1="565" y1="100" x2="765" y2="475"/>
    <line x1="680" y1="100" x2="880" y2="475"/>
    <line x1="795" y1="100" x2="995" y2="475"/>
    <line x1="910" y1="100" x2="1100" y2="400"/>
  </g>

  <!-- Stack layers (isometric boxes) -->
  <!-- Layer 4: Python/Go -->
  <g transform="translate(640, 160)">
    <!-- Top face -->
    <polygon points="0,-35 90,-10 0,15 -90,-10" fill="#161c35" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
    <!-- Right face -->
    <polygon points="90,-10 90,30 0,55 0,15" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.7"/>
    <!-- Left face -->
    <polygon points="-90,-10 0,15 0,55 -90,30" fill="#0d1226" stroke="#818cf8" stroke-width="0.7" opacity="0.7"/>
    <text x="0" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#a5b4fc" opacity="0.8">Python · Go · Rust</text>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="9" fill="#525a72" opacity="0.9">[RUNTIME]</text>
  </g>

  <!-- Layer 3: LLM -->
  <g transform="translate(640, 240)">
    <polygon points="0,-35 90,-10 0,15 -90,-10" fill="#16204a" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
    <polygon points="90,-10 90,30 0,55 0,15" fill="#10172e" stroke="#818cf8" stroke-width="0.7" opacity="0.7"/>
    <polygon points="-90,-10 0,15 0,55 -90,30" fill="#0d1428" stroke="#818cf8" stroke-width="0.7" opacity="0.7"/>
    <text x="0" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#a5b4fc" opacity="0.8">vLLM · Ollama · TGI</text>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="9" fill="#525a72" opacity="0.9">[INFERENCE]</text>
  </g>

  <!-- Layer 2: Vector DB -->
  <g transform="translate(640, 320)">
    <polygon points="0,-35 90,-10 0,15 -90,-10" fill="#1a2450" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
    <polygon points="90,-10 90,30 0,55 0,15" fill="#141b38" stroke="#818cf8" stroke-width="0.7" opacity="0.7"/>
    <polygon points="-90,-10 0,15 0,55 -90,30" fill="#111530" stroke="#818cf8" stroke-width="0.7" opacity="0.7"/>
    <text x="0" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#a5b4fc" opacity="0.8">Qdrant · PG · Redis</text>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="9" fill="#525a72" opacity="0.9">[VECTOR DB]</text>
  </g>

  <!-- Layer 1: Infra -->
  <g transform="translate(640, 400)">
    <polygon points="0,-35 90,-10 0,15 -90,-10" fill="#1e285a" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
    <polygon points="90,-10 90,30 0,55 0,15" fill="#16204a" stroke="#818cf8" stroke-width="0.7" opacity="0.7"/>
    <polygon points="-90,-10 0,15 0,55 -90,30" fill="#131c42" stroke="#818cf8" stroke-width="0.7" opacity="0.7"/>
    <text x="0" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#a5b4fc" opacity="0.8">Docker · K8s · Linux</text>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="9" fill="#525a72" opacity="0.9">[INFRA]</text>
  </g>

  <!-- Glow on top layer -->
  <ellipse cx="640" cy="125" rx="90" ry="18" fill="#818cf8" opacity="0.08" filter="url(#tf1)"/>

  <!-- Data flow lines on right -->
  <g transform="translate(820, 200)" opacity="0.55" font-family="monospace" font-size="10" fill="#525a72">
    <text x="0" y="0">&gt; FastAPI · gRPC · REST</text>
    <text x="0" y="40">&gt; 1C · SAP · EDO adapters</text>
    <text x="0" y="80">&gt; LDAP · Active Directory</text>
    <text x="0" y="120">&gt; SIEM · Kafka · S3</text>
  </g>

  <!-- Accent dots on stack edges -->
  <circle cx="730" cy="125" r="3" fill="#4ade80" opacity="0.9"/>
  <circle cx="730" cy="205" r="3" fill="#818cf8" opacity="0.9"/>
  <circle cx="730" cy="285" r="3" fill="#818cf8" opacity="0.8"/>
  <circle cx="730" cy="365" r="3" fill="#818cf8" opacity="0.7"/>
</svg>
