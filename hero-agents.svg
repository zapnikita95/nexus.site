<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="bg1" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e2a55" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Background wash -->
  <rect width="1200" height="600" fill="#0b0f1a"/>
  <rect width="1200" height="600" fill="url(#bg1)"/>

  <!-- Outer glow blobs -->
  <ellipse cx="900" cy="280" rx="320" ry="280" fill="url(#glow1)" filter="url(#blur2)"/>
  <ellipse cx="750" cy="350" rx="180" ry="160" fill="url(#glow2)" filter="url(#blur2)"/>

  <!-- Grid lines (perspective) -->
  <g opacity="0.06" stroke="#818cf8" stroke-width="1">
    <line x1="500" y1="0" x2="0" y2="600"/>
    <line x1="620" y1="0" x2="120" y2="600"/>
    <line x1="740" y1="0" x2="240" y2="600"/>
    <line x1="860" y1="0" x2="360" y2="600"/>
    <line x1="980" y1="0" x2="480" y2="600"/>
    <line x1="1100" y1="0" x2="600" y2="600"/>
    <line x1="1200" y1="60" x2="700" y2="600"/>
    <line x1="400" y1="150" x2="1200" y2="150"/>
    <line x1="350" y1="250" x2="1200" y2="250"/>
    <line x1="300" y1="350" x2="1200" y2="350"/>
    <line x1="250" y1="450" x2="1200" y2="450"/>
  </g>

  <!-- Central orchestrator node -->
  <g transform="translate(760, 290)">
    <circle r="52" fill="#0b0f1a" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
    <circle r="52" fill="#818cf8" opacity="0.07"/>
    <circle r="40" fill="none" stroke="#818cf8" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.4"/>
    <circle r="26" fill="#161c35" stroke="#a5b4fc" stroke-width="1" opacity="0.9"/>
    <!-- Hex icon -->
    <polygon points="0,-14 12,-7 12,7 0,14 -12,7 -12,-7" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="5" text-anchor="middle" font-family="monospace" font-size="11" fill="#a5b4fc" opacity="0.9">ORCH</text>
  </g>

  <!-- Worker nodes with connecting lines -->
  <!-- Node 1: top-left -->
  <g>
    <line x1="760" y1="290" x2="570" y2="160" stroke="#818cf8" stroke-width="1" opacity="0.3" stroke-dasharray="5,3"/>
    <circle cx="570" cy="160" r="32" fill="#10152a" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <circle cx="570" cy="160" r="32" fill="#818cf8" opacity="0.05"/>
    <text x="570" y="155" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8" opacity="0.7">COMPLIANCE</text>
    <text x="570" y="168" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8" opacity="0.7">AGENT</text>
    <circle cx="570" cy="160" r="5" fill="#4ade80" opacity="0.8"/>
    <circle cx="570" cy="160" r="5" fill="#4ade80" opacity="0.3">
      <animate attributeName="r" from="5" to="18" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.3" to="0" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Node 2: top-right -->
  <g>
    <line x1="760" y1="290" x2="940" y2="155" stroke="#818cf8" stroke-width="1" opacity="0.3" stroke-dasharray="5,3"/>
    <circle cx="940" cy="155" r="32" fill="#10152a" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <circle cx="940" cy="155" r="32" fill="#818cf8" opacity="0.05"/>
    <text x="940" y="150" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8" opacity="0.7">FEEDBACK</text>
    <text x="940" y="163" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8" opacity="0.7">AGENT</text>
    <circle cx="940" cy="155" r="5" fill="#4ade80" opacity="0.8"/>
    <circle cx="940" cy="155" r="5" fill="#4ade80" opacity="0.3">
      <animate attributeName="r" from="5" to="18" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.3" to="0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Node 3: right -->
  <g>
    <line x1="760" y1="290" x2="1010" y2="300" stroke="#818cf8" stroke-width="1" opacity="0.3" stroke-dasharray="5,3"/>
    <circle cx="1010" cy="300" r="32" fill="#10152a" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <circle cx="1010" cy="300" r="32" fill="#818cf8" opacity="0.05"/>
    <text x="1010" y="295" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8" opacity="0.7">OPERATIONS</text>
    <text x="1010" y="308" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8" opacity="0.7">AGENT</text>
    <circle cx="1010" cy="300" r="5" fill="#4ade80" opacity="0.8"/>
  </g>

  <!-- Node 4: bottom-right -->
  <g>
    <line x1="760" y1="290" x2="920" y2="430" stroke="#818cf8" stroke-width="1" opacity="0.3" stroke-dasharray="5,3"/>
    <circle cx="920" cy="430" r="32" fill="#10152a" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <circle cx="920" cy="430" r="32" fill="#818cf8" opacity="0.05"/>
    <text x="920" y="425" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8" opacity="0.7">VERIFIER</text>
    <text x="920" y="438" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8" opacity="0.7">AGENT</text>
    <circle cx="920" cy="430" r="5" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Node 5: bottom-left -->
  <g>
    <line x1="760" y1="290" x2="600" y2="420" stroke="#818cf8" stroke-width="1" opacity="0.3" stroke-dasharray="5,3"/>
    <circle cx="600" cy="420" r="32" fill="#10152a" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <circle cx="600" cy="420" r="32" fill="#818cf8" opacity="0.05"/>
    <text x="600" y="415" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8" opacity="0.7">RAG</text>
    <text x="600" y="428" text-anchor="middle" font-family="monospace" font-size="8" fill="#818cf8" opacity="0.7">WORKER</text>
    <circle cx="600" cy="420" r="5" fill="#4ade80" opacity="0.8"/>
  </g>

  <!-- Animated data packets -->
  <g opacity="0.7">
    <circle r="4" fill="#a5b4fc">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M760,290 L570,160"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="4" fill="#a5b4fc">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M760,290 L940,155"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#4ade80">
      <animateMotion dur="2.2s" repeatCount="indefinite" path="M920,430 L760,290"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
