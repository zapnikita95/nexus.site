<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="ag1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e2a55" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ag2" cx="80%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="af1"><feGaussianBlur stdDeviation="15"/></filter>
    <filter id="af2"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <rect width="1400" height="400" fill="#0b0f1a"/>
  <rect width="1400" height="400" fill="url(#ag1)"/>
  <ellipse cx="1100" cy="180" rx="420" ry="300" fill="url(#ag2)" filter="url(#af1)"/>

  <!-- Fine grid -->
  <g opacity="0.04" stroke="#818cf8" stroke-width="1">
    <line x1="0" y1="80" x2="1400" y2="80"/>
    <line x1="0" y1="160" x2="1400" y2="160"/>
    <line x1="0" y1="240" x2="1400" y2="240"/>
    <line x1="0" y1="320" x2="1400" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
    <line x1="1200" y1="0" x2="1200" y2="400"/>
  </g>

  <!-- Abstract 3D rings (right side) -->
  <g transform="translate(1100, 190)" opacity="0.55">
    <!-- Outermost ring -->
    <ellipse cx="0" cy="0" rx="200" ry="56" fill="none" stroke="#818cf8" stroke-width="1.2" opacity="0.15"/>
    <ellipse cx="0" cy="-22" rx="200" ry="56" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.12"/>
    <ellipse cx="0" cy="-44" rx="200" ry="56" fill="none" stroke="#818cf8" stroke-width="0.9" opacity="0.10"/>
    <ellipse cx="0" cy="-66" rx="200" ry="56" fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.08"/>
    <ellipse cx="0" cy="-88" rx="200" ry="56" fill="none" stroke="#818cf8" stroke-width="0.7" opacity="0.06"/>
    <ellipse cx="0" cy="-110" rx="200" ry="56" fill="none" stroke="#818cf8" stroke-width="0.6" opacity="0.05"/>
    <!-- Inner ring stack with glow -->
    <ellipse cx="0" cy="0" rx="120" ry="33" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity="0.3"/>
    <ellipse cx="0" cy="-18" rx="120" ry="33" fill="none" stroke="#a5b4fc" stroke-width="1.3" opacity="0.25"/>
    <ellipse cx="0" cy="-36" rx="120" ry="33" fill="none" stroke="#a5b4fc" stroke-width="1.1" opacity="0.20"/>
    <ellipse cx="0" cy="-54" rx="120" ry="33" fill="none" stroke="#a5b4fc" stroke-width="0.9" opacity="0.15"/>
    <ellipse cx="0" cy="-72" rx="120" ry="33" fill="none" stroke="#a5b4fc" stroke-width="0.7" opacity="0.10"/>
    <!-- Core -->
    <ellipse cx="0" cy="-36" rx="50" ry="14" fill="#818cf8" opacity="0.12" filter="url(#af2)"/>
    <ellipse cx="0" cy="-36" rx="26" ry="7" fill="#818cf8" opacity="0.35"/>
  </g>

  <!-- Horizontal data stream lines -->
  <g opacity="0.25">
    <line x1="0" y1="140" x2="850" y2="140" stroke="#818cf8" stroke-width="1" stroke-dasharray="8,4"/>
    <line x1="0" y1="200" x2="820" y2="200" stroke="#818cf8" stroke-width="0.7" stroke-dasharray="6,6"/>
    <line x1="0" y1="260" x2="840" y2="260" stroke="#818cf8" stroke-width="0.5" stroke-dasharray="5,7"/>
  </g>

  <!-- Small terminal decorations -->
  <g opacity="0.3" font-family="monospace" font-size="11" fill="#525a72">
    <text x="40" y="345">&gt; нексус-тех.рф / статьи</text>
    <text x="40" y="365" fill="#818cf8" opacity="0.4">■</text>
  </g>
</svg>
