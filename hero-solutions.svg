<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="slBG" cx="70%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#1e2555" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#121a35" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slHub" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2348" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f1630" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="slRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a5b4fc" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="slFadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b0f1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="slGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="rgba(129,140,248,0.07)" stroke-width="1"/>
    </pattern>
    <filter id="slGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1200" height="600" fill="#0b0f1a"/>
  <rect x="600" y="0" width="600" height="600" fill="url(#slGrid)"/>
  <circle cx="890" cy="300" r="360" fill="url(#slBG)"/>

  <!-- Left-side fade mask so anything subtle on the left stays fully invisible behind title -->
  <rect x="0" y="0" width="620" height="600" fill="url(#slFadeL)" opacity="0.98"/>

  <!-- Corner tags (kept to right half) -->
  <g font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="3" fill="rgba(165,180,252,0.75)">
    <text x="660" y="34">[SYS] ENTERPRISE · WORKFLOW · RUNNING</text>
    <text x="1160" y="34" text-anchor="end">NX-CORE · v2.6</text>
    <text x="660" y="580">ON-PREMISE · 152-ФЗ · AIR-GAP</text>
    <text x="1160" y="580" text-anchor="end">LATENCY · p95 · 2.1s</text>
  </g>

  <!-- 3 source chips orbiting on LEFT of hex (compact, no big cards) -->
  <g font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1.6">
    <!-- Source 1: DOCS (top-left of hex) -->
    <g transform="translate(680 180)">
      <rect x="-70" y="-24" width="140" height="48" rx="9" fill="url(#slCard)" stroke="rgba(129,140,248,0.6)" stroke-width="1.3"/>
      <g transform="translate(-58 -10)" stroke="rgba(199,210,254,0.95)" fill="none" stroke-width="1.3" stroke-linecap="round">
        <path d="M2 1 L14 1 L18 5 L18 19 L2 19 Z"/>
        <path d="M14 1 L14 5 L18 5"/>
        <line x1="5" y1="9" x2="15" y2="9"/>
        <line x1="5" y1="13" x2="15" y2="13"/>
      </g>
      <text x="-30" y="-2" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="0" fill="#e5e7eb">Документы</text>
      <text x="-30" y="12" fill="rgba(165,180,252,0.75)">152-ФЗ · PDF</text>
      <circle cx="56" cy="-13" r="3" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    </g>
    <!-- Source 2: CHATS (middle-left of hex) -->
    <g transform="translate(660 300)">
      <rect x="-70" y="-24" width="140" height="48" rx="9" fill="url(#slCard)" stroke="rgba(129,140,248,0.6)" stroke-width="1.3"/>
      <g transform="translate(-58 -10)" stroke="rgba(199,210,254,0.95)" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 4 Q2 2 4 2 L18 2 Q20 2 20 4 L20 15 Q20 17 18 17 L10 17 L6 21 L6 17 L4 17 Q2 17 2 15 Z"/>
        <line x1="6" y1="7" x2="16" y2="7"/>
        <line x1="6" y1="11" x2="13" y2="11"/>
      </g>
      <text x="-30" y="-2" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="0" fill="#e5e7eb">Обращения</text>
      <text x="-30" y="12" fill="rgba(165,180,252,0.75)">CRM · EMAIL</text>
      <circle cx="56" cy="-13" r="3" fill="#6366f1"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <!-- Source 3: TASKS (bottom-left of hex) -->
    <g transform="translate(680 420)">
      <rect x="-70" y="-24" width="140" height="48" rx="9" fill="url(#slCard)" stroke="rgba(129,140,248,0.6)" stroke-width="1.3"/>
      <g transform="translate(-58 -10)" stroke="rgba(199,210,254,0.95)" fill="none" stroke-width="1.3" stroke-linecap="round">
        <rect x="2" y="2" width="18" height="18" rx="2"/>
        <path d="M6 10 L9 13 L15 7"/>
      </g>
      <text x="-30" y="-2" font-family="'Inter',system-ui,sans-serif" font-size="11" font-weight="700" letter-spacing="0" fill="#e5e7eb">Операции</text>
      <text x="-30" y="12" fill="rgba(165,180,252,0.75)">1С · ERP</text>
      <circle cx="56" cy="-13" r="3" fill="#22c55e"><animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- Central hexagon HUB (shifted right to x=890) -->
  <g transform="translate(890 300)">
    <circle r="220" fill="url(#slHub)" filter="url(#slGlow)"/>
    <circle r="160" fill="none" stroke="rgba(165,180,252,0.25)" stroke-width="1" stroke-dasharray="4 8"/>
    <circle r="130" fill="none" stroke="rgba(165,180,252,0.18)" stroke-width="1" stroke-dasharray="2 10"/>
    <polygon points="0,-108 93.5,-54 93.5,54 0,108 -93.5,54 -93.5,-54"
             fill="rgba(67,56,202,0.35)" stroke="rgba(199,210,254,0.95)" stroke-width="2"/>
    <polygon points="0,-108 93.5,-54 93.5,54 0,108 -93.5,54 -93.5,-54"
             fill="none" stroke="rgba(199,210,254,0.6)" stroke-width="1.5">
      <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite"/>
    </polygon>
    <circle r="74" fill="rgba(16,21,42,0.75)" stroke="rgba(165,180,252,0.55)" stroke-width="1.2"/>
    <g fill="none" stroke="rgba(199,210,254,0.95)" stroke-width="1.6">
      <circle r="22"/>
      <ellipse rx="44" ry="18" transform="rotate(30)"/>
      <ellipse rx="44" ry="18" transform="rotate(-30)"/>
      <circle r="5" fill="rgba(199,210,254,1)" stroke="none"/>
    </g>
    <g font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1.6" fill="rgba(199,210,254,0.85)" text-anchor="middle">
      <text y="-120">ROUTE</text>
      <text x="106" y="-54">VERIFY</text>
      <text x="106" y="62">EXECUTE</text>
      <text y="128">NOTIFY</text>
      <text x="-106" y="62">CRITIC</text>
      <text x="-106" y="-54">PARSE</text>
    </g>
    <text y="160" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" letter-spacing="4" fill="rgba(199,210,254,1)">NEXUS CORE</text>
    <text y="178" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="2" fill="rgba(165,180,252,0.7)">12 AGENTS · 3 WORKFLOWS</text>
  </g>

  <!-- Right-side status rail -->
  <g transform="translate(1000 140)">
    <rect x="0" y="0" width="190" height="320" rx="12" fill="rgba(16,21,42,0.8)" stroke="rgba(129,140,248,0.35)" stroke-width="1.2"/>
    <text x="20" y="28" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="3" fill="rgba(165,180,252,0.9)">LIVE · OUTPUTS</text>
    <line x1="20" y1="40" x2="170" y2="40" stroke="rgba(129,140,248,0.25)"/>
    <g transform="translate(20 60)">
      <circle cx="6" cy="8" r="5.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.4;1" dur="1.4s" repeatCount="indefinite"/></circle>
      <text x="22" y="6" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="2" fill="rgba(229,231,235,0.95)">WORKFLOW</text>
      <text x="22" y="20" font-family="'JetBrains Mono',monospace" font-size="8.5" letter-spacing="1.5" fill="rgba(165,180,252,0.7)">ACTIVE · 4 RUN</text>
    </g>
    <g transform="translate(20 110)">
      <circle cx="6" cy="8" r="5.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.4;1" dur="1.7s" repeatCount="indefinite"/></circle>
      <text x="22" y="6" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="2" fill="rgba(229,231,235,0.95)">CITIZENS</text>
      <text x="22" y="20" font-family="'JetBrains Mono',monospace" font-size="8.5" letter-spacing="1.5" fill="rgba(165,180,252,0.7)">ROUTING · 12/s</text>
    </g>
    <g transform="translate(20 160)">
      <circle cx="6" cy="8" r="5.5" fill="#818cf8"><animate attributeName="opacity" values="1;0.5;1" dur="2.1s" repeatCount="indefinite"/></circle>
      <text x="22" y="6" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="2" fill="rgba(229,231,235,0.95)">ON-PREMISE</text>
      <text x="22" y="20" font-family="'JetBrains Mono',monospace" font-size="8.5" letter-spacing="1.5" fill="rgba(165,180,252,0.7)">AIR-GAP · ONLY</text>
    </g>
    <g transform="translate(20 210)">
      <circle cx="6" cy="8" r="5.5" fill="#fbbf24"><animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/></circle>
      <text x="22" y="6" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="2" fill="rgba(229,231,235,0.95)">ROI · CALC</text>
      <text x="22" y="20" font-family="'JetBrains Mono',monospace" font-size="8.5" letter-spacing="1.5" fill="rgba(165,180,252,0.7)">3.4× · 11 MO</text>
    </g>
    <g transform="translate(20 260)">
      <circle cx="6" cy="8" r="5.5" fill="#22c55e"><animate attributeName="opacity" values="1;0.4;1" dur="1.3s" repeatCount="indefinite"/></circle>
      <text x="22" y="6" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="2" fill="rgba(229,231,235,0.95)">MULTIAGENT</text>
      <text x="22" y="20" font-family="'JetBrains Mono',monospace" font-size="8.5" letter-spacing="1.5" fill="rgba(165,180,252,0.7)">READY · 12 NODES</text>
    </g>
  </g>

  <!-- Connections from source chips to hub (short, staying inside right area) -->
  <g stroke="rgba(129,140,248,0.55)" stroke-width="1.3" fill="none" stroke-linecap="round">
    <path d="M754 180 C790 180 798 220 804 246"/>
    <path d="M734 300 L800 300"/>
    <path d="M754 420 C790 420 798 380 804 354"/>
  </g>

  <!-- Connections from hub to status rail -->
  <g stroke="rgba(129,140,248,0.4)" stroke-width="1.2" fill="none" stroke-dasharray="4 5">
    <path d="M984 260 L1000 210"/>
    <path d="M998 300 L1000 290"/>
    <path d="M984 340 L1000 360"/>
  </g>

  <!-- Animated packets -->
  <g>
    <circle r="3" fill="#a5b4fc">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M754 180 C790 180 798 220 804 246"/>
    </circle>
    <circle r="3" fill="#818cf8">
      <animateMotion dur="2.8s" begin="0.6s" repeatCount="indefinite" path="M734 300 L800 300"/>
    </circle>
    <circle r="3" fill="#22c55e">
      <animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M754 420 C790 420 798 380 804 354"/>
    </circle>
    <circle r="2.6" fill="#a5b4fc">
      <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M984 260 L1000 210"/>
    </circle>
    <circle r="2.6" fill="#a5b4fc">
      <animateMotion dur="2.4s" begin="1.4s" repeatCount="indefinite" path="M984 340 L1000 360"/>
    </circle>
  </g>

  <!-- Bottom highlight rail -->
  <rect x="620" y="540" width="540" height="1.5" fill="url(#slRail)" opacity="0.6"/>
</svg>
