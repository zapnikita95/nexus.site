<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="slg1" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a2040" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="slb1"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="slb2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1200" height="600" fill="#0b0f1a"/>
  <rect width="1200" height="600" fill="url(#slg1)"/>
  <ellipse cx="820" cy="280" rx="380" ry="300" fill="url(#slg2)" filter="url(#slb1)"/>

  <!-- Outer orbit rings -->
  <g transform="translate(800, 280)" opacity="0.1">
    <circle r="250" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,8"/>
    <circle r="190" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="2,6"/>
    <circle r="130" fill="none" stroke="#a5b4fc" stroke-width="0.8" stroke-dasharray="3,5"/>
  </g>

  <!-- Central hexagonal hub -->
  <g transform="translate(800, 270)">
    <!-- Glow -->
    <polygon points="0,-100 87,-50 87,50 0,100 -87,50 -87,-50"
          fill="#818cf8" opacity="0.05" filter="url(#slb1)"/>
    <!-- Outer hex -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45"
          fill="#10152a" stroke="#818cf8" stroke-width="1.5" opacity="0.8"/>
    <!-- Inner hex -->
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"
          fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.3" stroke-dasharray="3,3"/>

    <!-- Central icon: connected nodes -->
    <circle cx="0" cy="-20" r="8" fill="#a5b4fc" opacity="0.8"/>
    <circle cx="-22" cy="14" r="6" fill="#a5b4fc" opacity="0.6"/>
    <circle cx="22" cy="14" r="6" fill="#a5b4fc" opacity="0.6"/>
    <line x1="0" y1="-12" x2="-18" y2="10" stroke="#a5b4fc" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="-12" x2="18" y2="10" stroke="#a5b4fc" stroke-width="1.2" opacity="0.7"/>
    <line x1="-16" y1="14" x2="16" y2="14" stroke="#a5b4fc" stroke-width="1" opacity="0.5"/>

    <!-- Pulsing ring -->
    <circle r="130" fill="none" stroke="#818cf8" stroke-width="1" opacity="0">
      <animate attributeName="r" from="50" to="130" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Solution category badges (all boxes same width + left-aligned column) -->
  <g font-family="monospace" font-size="12" fill="#818cf8">
    <!-- LEFT column: x=455, width=225, same for all 5 boxes -->
    <g transform="translate(455, 140)" opacity="0.75">
      <rect x="0" y="-14" width="225" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">152-ФЗ · COMPLIANT</text>
      <line x1="225" y1="0" x2="650" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    </g>
    <g transform="translate(455, 200)" opacity="0.7">
      <rect x="0" y="-14" width="225" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">ЧЕСТНЫЙ ЗНАК · AUTO</text>
      <line x1="225" y1="0" x2="650" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    </g>
    <g transform="translate(455, 260)" opacity="0.65">
      <rect x="0" y="-14" width="225" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">DOC CHECK · REALTIME</text>
      <line x1="225" y1="0" x2="650" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    </g>
    <g transform="translate(455, 320)" opacity="0.7">
      <rect x="0" y="-14" width="225" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#a5b4fc" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">ESCALATION · SMART</text>
      <line x1="225" y1="0" x2="650" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    </g>
    <g transform="translate(455, 380)" opacity="0.65">
      <rect x="0" y="-14" width="225" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">SLA 99.9% · STABLE</text>
      <line x1="225" y1="0" x2="650" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    </g>

    <!-- RIGHT column: x=970, width=200, same for all 5 boxes -->
    <g transform="translate(970, 150)" opacity="0.75">
      <line x1="-120" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
      <rect x="0" y="-14" width="200" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">WORKFLOW · ACTIVE</text>
    </g>
    <g transform="translate(970, 215)" opacity="0.7">
      <line x1="-120" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
      <rect x="0" y="-14" width="200" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">CITIZENS · ROUTING</text>
    </g>
    <g transform="translate(970, 280)" opacity="0.65">
      <line x1="-120" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
      <rect x="0" y="-14" width="200" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">ON-PREMISE · ONLY</text>
    </g>
    <g transform="translate(970, 345)" opacity="0.7">
      <line x1="-120" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
      <rect x="0" y="-14" width="200" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#fbbf24" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">ROI · CALCULATING</text>
    </g>
    <g transform="translate(970, 410)" opacity="0.65">
      <line x1="-120" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
      <rect x="0" y="-14" width="200" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">MULTIAGENT · READY</text>
    </g>
  </g>
</svg>
