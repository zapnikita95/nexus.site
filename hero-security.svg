<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sg1" cx="65%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a2040" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0b0f1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sg2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="sf1"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="sf2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1200" height="600" fill="#0b0f1a"/>
  <rect width="1200" height="600" fill="url(#sg1)"/>
  <ellipse cx="820" cy="280" rx="380" ry="300" fill="url(#sg2)" filter="url(#sf1)"/>

  <!-- Shield outer rings -->
  <g transform="translate(800, 280)" opacity="0.12">
    <circle r="240" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="3,6"/>
    <circle r="190" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="2,8"/>
    <circle r="140" fill="none" stroke="#a5b4fc" stroke-width="0.8" stroke-dasharray="4,4"/>
  </g>

  <!-- Shield shape -->
  <g transform="translate(800, 270)">
    <!-- Shield glow -->
    <path d="M0,-120 L90,-80 L90,20 Q90,100 0,140 Q-90,100 -90,20 L-90,-80 Z"
          fill="#818cf8" opacity="0.06" filter="url(#sf1)"/>
    <!-- Shield outline -->
    <path d="M0,-110 L82,-73 L82,22 Q82,94 0,130 Q-82,94 -82,22 L-82,-73 Z"
          fill="#10152a" stroke="#818cf8" stroke-width="1.5" opacity="0.9"/>
    <!-- Shield inner -->
    <path d="M0,-85 L62,-55 L62,18 Q62,72 0,100 Q-62,72 -62,18 L-62,-55 Z"
          fill="none" stroke="#818cf8" stroke-width="0.8" opacity="0.4" stroke-dasharray="3,3"/>

    <!-- Lock icon -->
    <rect x="-22" y="-8" width="44" height="34" rx="4" fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity="0.9"/>
    <path d="M-14,-8 L-14,-22 Q-14,-40 0,-40 Q14,-40 14,-22 L14,-8"
          fill="none" stroke="#a5b4fc" stroke-width="1.5" opacity="0.9"/>
    <circle cx="0" cy="12" r="6" fill="#a5b4fc" opacity="0.8"/>
    <line x1="0" y1="12" x2="0" y2="22" stroke="#a5b4fc" stroke-width="1.5" opacity="0.8"/>

    <!-- Animated scan ring -->
    <circle r="140" fill="none" stroke="#4ade80" stroke-width="1" opacity="0">
      <animate attributeName="r" from="60" to="140" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Security status items -->
  <g font-family="monospace" font-size="12" fill="#818cf8">
    <!-- Left items -->
    <g transform="translate(490, 150)" opacity="0.75">
      <rect x="0" y="-14" width="180" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">AES-256 · ACTIVE</text>
      <line x1="180" y1="0" x2="630" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    </g>
    <g transform="translate(470, 210)" opacity="0.7">
      <rect x="0" y="-14" width="196" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">TLS 1.3 · SECURED</text>
      <line x1="196" y1="0" x2="640" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    </g>
    <g transform="translate(450, 270)" opacity="0.65">
      <rect x="0" y="-14" width="212" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">152-ФЗ · COMPLIANT</text>
      <line x1="212" y1="0" x2="660" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    </g>
    <g transform="translate(470, 330)" opacity="0.7">
      <rect x="0" y="-14" width="196" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">RBAC/LDAP · READY</text>
      <line x1="196" y1="0" x2="660" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    </g>
    <g transform="translate(490, 390)" opacity="0.65">
      <rect x="0" y="-14" width="180" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#fbbf24" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">PROMPT INJ. · GUARD</text>
      <line x1="180" y1="0" x2="670" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    </g>
    <!-- Right items -->
    <g transform="translate(970, 150)" opacity="0.75">
      <line x1="-150" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
      <rect x="0" y="-14" width="168" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">AUDIT LOG · ON</text>
    </g>
    <g transform="translate(970, 215)" opacity="0.7">
      <line x1="-120" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
      <rect x="0" y="-14" width="174" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">DLP · MONITORING</text>
    </g>
    <g transform="translate(975, 280)" opacity="0.65">
      <line x1="-105" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
      <rect x="0" y="-14" width="176" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">ON-PREMISE · ONLY</text>
    </g>
    <g transform="translate(970, 345)" opacity="0.7">
      <line x1="-120" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
      <rect x="0" y="-14" width="172" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">SIEM · COMPATIBLE</text>
    </g>
    <g transform="translate(975, 410)" opacity="0.65">
      <line x1="-105" y1="0" x2="0" y2="0" stroke="#818cf8" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
      <rect x="0" y="-14" width="172" height="22" fill="#10152a" stroke="#818cf8" stroke-width="0.7" opacity="0.6" rx="2"/>
      <circle cx="10" cy="0" r="4" fill="#4ade80" opacity="0.9"/>
      <text x="22" y="4" fill="#94a3b8" font-size="11">ФСТЭК · ALIGNED</text>
    </g>
  </g>
</svg>
